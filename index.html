<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Dashboard — Vacantes Remotas USD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Quicksand:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f1420; --panel:#171d2b; --panel2:#1e2536; --border:#2a3346;
    --text:#e6ebf5; --muted:#98a4bd; --accent:#5b8cff;
    --t1:#3ddc84; --t2:#ffd166; --t3:#f79f5b; --pausa:#8aa0c6; --desc:#ff6b6b;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;font-size:15px}
  .wrap{max-width:1000px;margin:0 auto;padding:24px 20px 70px}
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .brand{font-size:13px;color:var(--muted)}
  .refresh{background:var(--panel);border:1px solid var(--border);color:var(--accent);border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer}
  .refresh:hover{background:var(--panel2)}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px;border-bottom:1px solid var(--border)}
  .tab{background:transparent;border:1px solid var(--border);border-bottom:none;color:var(--muted);border-radius:10px 10px 0 0;padding:9px 16px;font-size:14px;cursor:pointer;font-weight:600;position:relative;top:1px}
  .tab:hover{color:var(--text);background:var(--panel)}
  .tab.active{color:var(--accent);background:var(--panel2);border-color:var(--border)}
  #search{width:100%;background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:10px 12px;font-size:14px;margin:0 0 20px}
  /* markdown */
  #md h1{font-size:26px;margin:6px 0 4px}
  #md h2{font-size:20px;margin:34px 0 6px;padding-bottom:6px;border-bottom:1px solid var(--border)}
  #md h3{font-size:16px;margin:22px 0 4px;color:var(--accent)}
  #md h4{font-size:14px;margin:16px 0 4px}
  #md p{margin:10px 0}
  #md a{color:var(--accent);text-decoration:none}
  #md a:hover{text-decoration:underline}
  #md hr{border:none;border-top:1px solid var(--border);margin:26px 0}
  #md blockquote{margin:14px 0;padding:10px 14px;background:var(--panel2);border-left:4px solid var(--accent);border-radius:8px;color:#cdd6ea}
  #md ul{padding-left:20px}
  #md li{margin:5px 0}
  #md code{background:var(--panel2);padding:2px 6px;border-radius:5px;font-size:13px}
  .tablewrap{overflow-x:auto;margin:12px 0;border:1px solid var(--border);border-radius:10px}
  #md table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:560px}
  #md th,#md td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:top}
  #md th{background:var(--panel2);color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.3px}
  #md tr:last-child td{border-bottom:none}
  #md tbody tr:hover{background:var(--panel)}
  /* interactive base */
  h1.title{font-size:24px;margin:6px 0 2px}
  .marketnote{margin:10px 0 6px;padding:10px 14px;background:var(--panel2);border-left:4px solid var(--t2);border-radius:8px;color:#e7ddc0;font-size:13.5px}
  .toolrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0 6px}
  .btn{background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:7px 11px;font-size:12.5px;cursor:pointer}
  .btn:hover{background:var(--panel2)}
  .btn.accent{color:var(--accent)}
  .counters{font-size:12.5px;color:var(--muted);margin-left:auto}
  .group{margin:20px 0 6px}
  .group h3{font-size:14px;letter-spacing:.3px;text-transform:uppercase;margin:0 0 8px;display:flex;align-items:center;gap:8px}
  .dot{width:10px;height:10px;border-radius:50%;display:inline-block}
  .g1 .dot{background:var(--t1)} .g2 .dot{background:var(--t2)} .g3 .dot{background:var(--t3)}
  .gpausa .dot{background:var(--pausa)} .gdescartada .dot{background:var(--desc)}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin:8px 0}
  .card.applied{border-color:var(--t1);box-shadow:inset 3px 0 0 var(--t1)}
  .card.gdescartada, .card.gpausa{opacity:.72}
  .card .h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
  .card .co{font-weight:700;font-size:15px}
  .card .role{color:var(--muted);font-size:13.5px}
  .badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
  .badge{font-size:11px;padding:2px 7px;border-radius:20px;border:1px solid var(--border);color:var(--muted)}
  .badge.usd{color:var(--t1);border-color:#2c5}
  .badge.pay{color:var(--t2);border-color:#a83}
  .card .note{font-size:12.5px;color:#c3cde0;margin:8px 0 0}
  .ctrls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
  .ctrls select{background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:7px;padding:5px 8px;font-size:12.5px}
  .ctrls label{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:5px;cursor:pointer}
  .mini{background:var(--panel2);border:1px solid var(--border);color:var(--muted);border-radius:6px;width:30px;height:28px;cursor:pointer;font-size:13px}
  .mini:hover{color:var(--text)}
  .card a.open{color:var(--accent);text-decoration:none;font-size:12.5px}
  .noteedit{width:100%;margin-top:8px;background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:7px;padding:7px 9px;font-size:12.5px;display:none}
  .flist{margin:8px 0}
  .frow{display:flex;gap:10px;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
  .frow a{color:var(--accent);text-decoration:none}
  .hidden{display:none!important}
  .loading{color:var(--muted);padding:40px 0;text-align:center}
  .err{color:#ff8080;padding:20px;background:var(--panel);border:1px solid var(--border);border-radius:10px}
  footer{color:var(--muted);font-size:12px;border-top:1px solid var(--border);margin-top:40px;padding-top:16px}

  /* ===================== Tema Sunny · ATARDECER ===================== */
  body.theme-sunny{
    color:#3a2233;
    font-family:'Quicksand',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:linear-gradient(180deg,#3a1c4a 0%,#7d2e63 16%,#c0433f 38%,#ee6d34 60%,#ff9e42 80%,#ffd489 100%) fixed;
  }
  body.theme-sunny .brand{color:#fff2e6;font-weight:600;text-shadow:0 1px 2px rgba(0,0,0,.35)}
  body.theme-sunny .refresh{background:rgba(255,255,255,.9);border:2px solid #ffb877;color:#d1541e;border-radius:22px;font-weight:700}
  body.theme-sunny .refresh:hover{background:#fff}
  body.theme-sunny .tabs{border-bottom:2px solid rgba(255,255,255,.35)}
  body.theme-sunny .tab{color:#fff2e6;border:2px solid rgba(255,255,255,.45);border-bottom:none;background:rgba(255,255,255,.12);border-radius:16px 16px 0 0;font-family:'Baloo 2',cursive,sans-serif;backdrop-filter:blur(2px)}
  body.theme-sunny .tab:hover{background:rgba(255,255,255,.25);color:#fff}
  body.theme-sunny .tab.active{color:#c8431a;background:#fff7ef;border-color:#fff}
  body.theme-sunny #search{background:rgba(255,255,255,.94);border:2px solid #ffb877;color:#5a3324;border-radius:16px}
  body.theme-sunny #search::placeholder{color:#c08a6b}
  body.theme-sunny footer{color:#fff2e6;border-top:2px solid rgba(255,255,255,.35);text-shadow:0 1px 2px rgba(0,0,0,.3)}

    html += '<span class="counters">T1: '+c['1']+' · T2: '+c['2']+' · T3: '+c['3']+' · Pausa: '+c['pausa']+' · Descartadas: '+c['descartada']+' · Aplicadas: '+c['aplicada']+'</span>';
    html += '</div>';

    // ---- grid: main (tiers/freelance/docencia) + aside (instrucciones) ----
    html += '<div class="su-grid"><div class="su-main">';

    TIERS.forEach(function(t){
      var list = jobs.filter(function(x){ return effTier(x.job)===t.k; });
      if(q){ list = list.filter(function(x){ return (x.job.company+' '+x.job.role+' '+effNote(x.job)).toLowerCase().indexOf(q)>-1; }); }
      list.sort(function(a,b){ return effOrder(a.job,a.base) - effOrder(b.job,b.base); });
      if(list.length===0 && q) return;
      html += '<div class="group '+t.cls+'"><h3><span class="dot"></span>'+esc(t.label)+' <span style="font-weight:400;opacity:.8">('+list.length+')</span></h3>';
      if(list.length===0){ html += '<div class="empty">—</div>'; }
      list.forEach(function(x, idx){ html += cardHTML(x.job, t, idx, list.length); });
      html += '</div>';
    });

    // docencia
    var doc = sunnyData.docencia || [];
    html += '<div class="group"><h3>🎓 Docencia / educativo — bilingüe, part-time/por hora, async</h3>';
    if(doc.length===0){ html += '<div class="empty">Por poblar en la próxima corrida (tutorías EN↔ES, ESL, traducción, EdTech).</div>'; }
    else { html += '<div class="flist">'; doc.forEach(function(f){
      html += '<div class="frow"><div><b>'+esc(f.company||f.platform||'')+'</b> — <span style="opacity:.85">'+esc(f.role||f.para||'')+'</span>'+(f.pay?' · <b>'+esc(f.pay)+'</b>':'')+'</div>'+(f.link?'<a href="'+esc(f.link)+'" target="_blank" rel="noopener">Abrir →</a>':'')+'</div>';
    }); html += '</div>'; }
    html += '</div>';

    // freelance
    html += '<div class="group"><h3>💻 Freelance / contratista — nicho forense (mejor $/hora · recomendado ⭐)</h3><div class="flist">';
    (sunnyData.freelance||[]).forEach(function(f){
      html += '<div class="frow"><div><b>'+(f.star?'⭐ ':'')+esc(f.platform)+'</b> — <span style="opacity:.85">'+esc(f.para)+'</span></div><a href="'+esc(f.link)+'" target="_blank" rel="noopener">Abrir →</a></div>';
    });
    html += '</div></div>';

    html += '</div>'; // /su-main

    // aside instrucciones
    html += '<aside class="su-aside"><div class="guide"><h3>📋 Cómo usar este tablero</h3><ol>';
    html += '<li><b>Revisa lo nuevo</b> de arriba hacia abajo: los <b>Tier 1/2</b> son los que mejor encajan contigo.</li>';
    html += '<li><b>Abre el link</b> ("Abrir →") para ver la vacante completa antes de aplicar.</li>';
    html += '<li>Cuando apliques, marca la casilla <b>“Aplicada”</b> — se pinta en verde y sube a su sección.</li>';
    html += '<li>¿No te late una? Cambia su <b>prioridad</b> en el menú (Tier 1/2/3, En pausa o Descartar).</li>';
    html += '<li>Usa <b>▲▼</b> para ordenar tus favoritas, y <b>✎</b> para dejarte una nota.</li>';
    html += '<li>El buscador de arriba <b>filtra</b> por empresa, rol o palabra.</li>';
    html += '<li>Tus cambios se guardan <b>en este navegador</b>. Usa <b>⬇️ Exportar</b> para respaldarlos.</li>';
    html += '</ol><div class="tip">💡 Ojo con el <b>horario</b>: aparece etiquetado, pero tú decides si te acomoda o si lo empalmas. Nada se te esconde.</div></div></aside>';

    html += '</div>'; // /su-grid

    sunnyEl.innerHTML = html;
    // recolocar contador si ya estaba cargado
    if(visitsText){ var el=document.getElementById('visitpill'); if(el){ el.innerHTML=visitsText; el.style.display='inline-flex'; } }
    else { countVisit(); }
  }

  function cardHTML(job, t, idx, total){
    var o = ov(job.id);
    var applied = !!o.applied;
    var cls = 'card '+t.cls+(applied?' applied':'');
    var h = '<div class="'+cls+'" data-id="'+job.id+'">';
    h += '<div class="h"><div><div class="co">'+esc(job.company)+'</div><div class="role">'+esc(job.role)+'</div>';
    h += '<div class="badges">';
    if(job.usd) h += '<span class="badge usd">USD: '+esc(job.usd)+'</span>';
    if(job.pay) h += '<span class="badge pay">'+esc(job.pay)+'</span>';
    if(applied && o.appliedDate) h += '<span class="badge">Aplicada '+esc(o.appliedDate)+'</span>';
    h += '</div></div>';
    if(job.link) h += '<a class="open" href="'+esc(job.link)+'" target="_blank" rel="noopener">Abrir →</a>';
    h += '</div>';
    var note = effNote(job);
    if(note) h += '<div class="note">'+esc(note)+'</div>';
    h += '<div class="ctrls">';
    h += '<select onchange="changeTier(\''+job.id+'\',this.value)" title="Cambiar prioridad">';
    TIER_OPTS.forEach(function(op){
      var sel = (effTier(job)===op[0] || (effTier(job)==='aplicada' && op[0]===(o.tier||job.tier)))?' selected':'';
      h += '<option value="'+op[0]+'"'+sel+'>'+op[1]+'</option>';
    });
    h += '</select>';
    h += '<label><input type="checkbox" '+(applied?'checked':'')+' onchange="toggleApplied(\''+job.id+'\',this.checked)"> Aplicada</label>';
    h += '<button class="mini" title="Subir prioridad" onclick="move(\''+job.id+'\',-1)" '+(idx===0?'disabled':'')+'>▲</button>';
    h += '<button class="mini" title="Bajar prioridad" onclick="move(\''+job.id+'\',1)" '+(idx===total-1?'disabled':'')+'>▼</button>';
    h += '<button class="mini" title="Nota" onclick="toggleNote(this)">✎</button>';
    h += '</div>';
    h += '<textarea class="noteedit" placeholder="Tu nota…" oninput="editNote(\''+job.id+'\',this.value)">'+esc(o.note!=null?o.note:'')+'</textarea>';
    h += '</div>';
    return h;
  }

  // ---------- actions ----------
  function changeTier(id, val){ var p={tier:val}; if(val!=null) p.applied=false; setOv(id,p); renderSunny(); }
  function toggleApplied(id, on){
    var patch = {applied:on};
    if(on){ patch.appliedDate = new Date().toISOString().slice(0,10); }
    setOv(id, patch); renderSunny();
  }
  function move(id, dir){
    var job = sunnyData.jobs.filter(function(j){return j.id===id;})[0];
    var tier = effTier(job);
    var group = sunnyData.jobs.map(function(j,i){return {job:j,base:i};})
      .filter(function(x){ return effTier(x.job)===tier; })
      .sort(function(a,b){ return effOrder(a.job,a.base)-effOrder(b.job,b.base); });
    var pos = group.findIndex(function(x){return x.job.id===id;});
    var np = pos+dir;
    if(np<0||np>=group.length) return;
    var tmp = group[pos]; group[pos]=group[np]; group[np]=tmp;
    group.forEach(function(x,i){ setOv(x.job.id, {order:i}); });
    renderSunny();
  }
  function toggleNote(btn){ var ta=btn.closest('.card').querySelector('.noteedit'); ta.style.display = ta.style.display==='block'?'none':'block'; if(ta.style.display==='block') ta.focus(); }
  function editNote(id, val){ setOv(id, {note:val}); }
  function exportOv(){
    var blob = new Blob([JSON.stringify(loadOv(),null,2)], {type:'application/json'});
    var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='sunny_cambios.json'; a.click();
  }
  function importOv(input){
    var f=input.files[0]; if(!f) return; var r=new FileReader();
    r.onload=function(){ try{ var o=JSON.parse(r.result); saveOv(o); renderSunny(); }catch(e){ alert('Archivo inválido'); } };
    r.readAsText(f);
  }
  function resetOv(){ if(confirm('¿Borrar todos tus cambios y volver a la priorización original?')){ localStorage.removeItem(LSKEY); renderSunny(); } }

  // ---------- markdown loader ----------
  function loadMd(bust){
    mdEl.innerHTML='<div class="loading">Cargando…</div>';
    fetch(mdSrc + (bust?('?t='+Date.now()):''), {cache: bust?'reload':'default'})
      .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.text(); })
      .then(function(md){
        mdEl.innerHTML = marked.parse(md);
        mdEl.querySelectorAll('table').forEach(function(t){
          if(t.parentElement.classList.contains('tablewrap')) return;
          var w=document.createElement('div'); w.className='tablewrap';
          t.parentNode.insertBefore(w,t); w.appendChild(t);
        });
        applyMdFilter();
      })
      .catch(function(e){ mdEl.innerHTML='<div class="err">No se pudo cargar '+mdSrc+' ('+e.message+').</div>'; });
  }
  function loadSunny(bust){
    sunnyEl.innerHTML='<div class="loading">Cargando…</div>';
    fetch(sunnySrc + (bust?('?t='+Date.now()):''), {cache: bust?'reload':'default'})
      .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
      .then(function(d){ sunnyData=d; renderSunny(); })
      .catch(function(e){ sunnyEl.innerHTML='<div class="err">No se pudo cargar '+sunnySrc+' ('+e.message+'). Si acabas de crear el archivo, espera 1 min y recarga.</div>'; });
  }
  function reloadCurrent(){ if(mode==='md') loadMd(true); else loadSunny(true); }

  // ---------- tabs ----------
  function applyTab(m){
    if(m!=='md' && m!=='sunny') m='md';
    mode = m;
    document.querySelectorAll('#tabs .tab').forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-mode')===m); });
    document.body.classList.toggle('theme-sunny', m==='sunny');
    var _b=document.getElementById('brand'); if(_b){ _b.innerHTML = (m==='sunny') ? '🌅 Dashboard Sunny · se actualiza <b>domingo, martes y jueves por la noche</b>' : '📋 Vacantes USD (SM/PM) · se actualiza cada mañana'; }
    if(m==='md'){ mdEl.classList.remove('hidden'); sunnyEl.classList.add('hidden'); if(mdEl.querySelector('.loading')||!mdEl.innerHTML) loadMd(); }
    else { sunnyEl.classList.remove('hidden'); mdEl.classList.add('hidden'); if(!sunnyData) loadSunny(); else renderSunny(); }
  }
  function hashToMode(){ return location.hash.slice(1)==='sunny' ? 'sunny' : 'md'; }
  function goTab(m){
    var h = (m==='sunny') ? 'sunny' : 'jack';
    if(location.hash.slice(1)!==h){ location.hash = h; }
    else { applyTab(m); }
  }
  document.querySelectorAll('#tabs .tab').forEach(function(btn){
    btn.addEventListener('click', function(){ goTab(this.getAttribute('data-mode')); });
  });
  window.addEventListener('hashchange', function(){ applyTab(hashToMode()); });

  // ---------- search ----------
  function applyMdFilter(){
    var q = searchEl.value.trim().toLowerCase();
    mdEl.querySelectorAll('table tbody tr').forEach(function(tr){
      tr.classList.toggle('hidden', q && tr.textContent.toLowerCase().indexOf(q)===-1);
    });
  }
  searchEl.addEventListener('input', function(){ if(mode==='md') applyMdFilter(); else renderSunny(); });

  applyTab(hashToMode());
</script>
