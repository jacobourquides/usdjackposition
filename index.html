<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Dashboard — Vacantes Remotas USD</title>
<style>
  :root{
    --bg:#0f1420; --panel:#171d2b; --panel2:#1e2536; --border:#2a3346;
    --text:#e6ebf5; --muted:#98a4bd; --accent:#5b8cff;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;font-size:15px}
  .wrap{max-width:1000px;margin:0 auto;padding:24px 20px 70px}
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  .brand{font-size:13px;color:var(--muted)}
  .refresh{background:var(--panel);border:1px solid var(--border);color:var(--accent);border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer}
  .refresh:hover{background:var(--panel2)}
  #search{width:100%;background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:10px 12px;font-size:14px;margin:0 0 20px}
  #content h1{font-size:26px;margin:6px 0 4px}
  #content h2{font-size:20px;margin:34px 0 6px;padding-bottom:6px;border-bottom:1px solid var(--border)}
  #content h3{font-size:16px;margin:22px 0 4px;color:var(--accent)}
  #content h4{font-size:14px;margin:16px 0 4px}
  #content p{margin:10px 0}
  #content a{color:var(--accent);text-decoration:none}
  #content a:hover{text-decoration:underline}
  #content hr{border:none;border-top:1px solid var(--border);margin:26px 0}
  #content blockquote{margin:14px 0;padding:10px 14px;background:var(--panel2);border-left:4px solid var(--accent);border-radius:8px;color:#cdd6ea}
  #content ul{padding-left:20px}
  #content li{margin:5px 0}
  #content code{background:var(--panel2);padding:2px 6px;border-radius:5px;font-size:13px}
  .tablewrap{overflow-x:auto;margin:12px 0;border:1px solid var(--border);border-radius:10px}
  #content table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:560px}
  #content th,#content td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:top}
  #content th{background:var(--panel2);color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.3px}
  #content tr:last-child td{border-bottom:none}
  #content tbody tr:hover{background:var(--panel)}
  .loading{color:var(--muted);padding:40px 0;text-align:center}
  .err{color:#ff8080;padding:20px;background:var(--panel);border:1px solid var(--border);border-radius:10px}
  .hidden{display:none!important}
  footer{color:var(--muted);font-size:12px;border-top:1px solid var(--border);margin-top:40px;padding-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <span class="brand">📋 Dashboard de vacantes · se actualiza cada mañana</span>
    <button class="refresh" onclick="load(true)">↻ Recargar</button>
  </div>
  <input type="text" id="search" placeholder="🔎 Filtrar filas por empresa, rol o palabra…">
  <div id="content"><div class="loading">Cargando…</div></div>
  <footer>Contenido ofuscado (sin datos personales). Fuente: registro del proyecto. Renderizado desde <code>dashboard.md</code>.</footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
  var contentEl = document.getElementById('content');

  function load(bust){
    var url = 'dashboard.md' + (bust ? ('?t=' + (bust===true?1:bust)) : '');
    fetch(url, {cache: bust ? 'reload' : 'default'})
      .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.text(); })
      .then(function(md){
        contentEl.innerHTML = marked.parse(md);
        // envolver tablas para scroll horizontal en móvil
        contentEl.querySelectorAll('table').forEach(function(t){
          if(t.parentElement.classList.contains('tablewrap')) return;
          var w = document.createElement('div'); w.className='tablewrap';
          t.parentNode.insertBefore(w, t); w.appendChild(t);
        });
      })
      .catch(function(e){
        contentEl.innerHTML = '<div class="err">No se pudo cargar dashboard.md ('+e.message+'). Si acabas de crear el sitio, espera 1 min y recarga.</div>';
      });
  }
  load();

  // Filtro de filas de tabla (en memoria)
  document.getElementById('search').addEventListener('input', function(){
    var q = this.value.trim().toLowerCase();
    contentEl.querySelectorAll('table tbody tr').forEach(function(tr){
      tr.classList.toggle('hidden', q && tr.textContent.toLowerCase().indexOf(q) === -1);
    });
  });
</script>
</body>
</html>
